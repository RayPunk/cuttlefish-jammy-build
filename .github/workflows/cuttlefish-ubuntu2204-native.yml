name: Cuttlefish Host - native Ubuntu 22.04

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Google android-cuttlefish release tag (native Jammy compatibility is NOT presumed)'
        type: string
        required: true
        default: 'v1.57.0'
      include_web_ui:
        description: 'Also build cuttlefish-user (WebRTC browser UI)'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  build-jammy-amd64:
    name: Build and check amd64 packages on Jammy
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Checkout public upstream at selected tag
        uses: actions/checkout@v4
        with:
          repository: google/android-cuttlefish
          ref: ${{ inputs.upstream_ref }}
          persist-credentials: false

      - name: Confirm native Ubuntu 22.04 build environment
        shell: bash
        run: |
          set -euo pipefail
          source /etc/os-release
          echo "OS=$PRETTY_NAME ARCH=$(dpkg --print-architecture)"
          test "$VERSION_ID" = '22.04'
          test "$(dpkg --print-architecture)" = 'amd64'
          dpkg-query -W -f='${Package} ${Version}\n' libc6
          git rev-parse HEAD

      # All sudo/apt and network operations below run on DISPOSABLE GitHub
      # infrastructure. No command in this workflow touches the user's PC.
      # The selected upstream tag brings uuid 1.28.0 into the media Rust graph.
      # Rust <1.89 cannot use eq_ignore_ascii_case in a const fn. Select the
      # Bazel-managed Rust toolchain, NOT merely the runner's PATH rustc.
      - name: Pin Bazel-managed Rust toolchain to 1.89.0 (runner checkout only)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('base/cvd/toolchain/rust.MODULE.bazel')
          source = p.read_text()
          assert 'rust_host_tools = use_extension(' in source, 'unexpected upstream Rust module layout'
          assert 'register_toolchains("@rust_toolchains//:all")' not in source, 'Rust toolchain registration already exists; inspect instead'
          extra = '''

          # Jammy-host build compatibility: uuid 1.28.0 requires rustc >=1.89
          # for const eq_ignore_ascii_case; Bazel owns its own rustc selection.
          rust_compiler_jammy = use_extension("@rules_rust//rust:extensions.bzl", "rust")
          rust_compiler_jammy.toolchain(versions = ["1.89.0"], edition = "2021")
          use_repo(rust_compiler_jammy, "rust_toolchains")
          register_toolchains("@rust_toolchains//:all")
          '''
          p.write_text(source.rstrip() + '\n' + extra)
          PYCODE
          git diff -- base/cvd/toolchain/rust.MODULE.bazel

      - name: Prepare build tools and Bazelisk on GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y devscripts config-package-dev debhelper equivs
          sudo tools/buildutils/installbazel.sh

      # Ubuntu 22.04 GitHub runners preinstall LLVM libunwind-14-dev,
      # which conflicts with the GNU libunwind-dev required by glog.
      # Explicitly requesting both runtime build dependencies makes apt
      # resolve that conflict on this DISPOSABLE runner, before mk-build-deps.
      - name: Resolve Jammy libunwind and glog build dependency conflict
        shell: bash
        run: |
          set -euo pipefail
          echo '=== APT resolver plan (runner only) ==='
          sudo apt-get -s install --no-install-recommends libunwind-dev libgoogle-glog-dev
          echo '=== Install explicitly requested build dependencies ==='
          sudo apt-get install -y --no-install-recommends libunwind-dev libgoogle-glog-dev
          dpkg-query -W -f='${Package} ${Version}\n' libunwind-dev libgoogle-glog-dev

      # Use a NEW cache namespace for the V4L2 UAPI layout fix. Bazel build.rs
      # reads the host kernel header, which may not be a declared action input.
      # Reusing V4 cached Rust bindings could retain the obsolete reserved[1].
      - name: Install Cuttlefish base build dependencies before targeted Rust preflight
        shell: bash
        run: |
          set -euo pipefail
          ( cd base && sudo mk-build-deps -i -t 'apt-get -o Debug::pkgProblemResolver=yes --no-install-recommends -y' )

      # Jammy's 5.15-era UAPI has __u32 reserved[1] in this ABI position.
      # The virtio-media 0.0.7 Rust code expects the later equivalent fields
      # __u8 flags + __u8 reserved[3]. The 20-byte struct layout is unchanged.
      # Only modify the disposable GitHub runner's host header, NOT users' PCs
      # and NOT any kernel/libc package; fail if the actual layout differs.
      - name: Adapt V4L2 requestbuffers UAPI on disposable Jammy runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          p = Path('/usr/include/linux/videodev2.h')
          src = p.read_text()
          pattern = r'struct\s+v4l2_requestbuffers\s*\{(?P<body>.*?)\n\};'
          m = re.search(pattern, src, re.S)
          if m is None:
              raise SystemExit('Unexpected videodev2.h: struct missing')
          body = m.group('body')
          for field in ('count', 'type', 'memory', 'capabilities'):
              if not re.search(r'__u32\s+' + field + r'\s*;', body):
                  raise SystemExit('Unexpected requestbuffers ABI field: ' + field)
          if re.search(r'__u8\s+flags\s*;', body) and re.search(r'__u8\s+reserved\s*\[\s*3\s*\]\s*;', body):
              print('V4L2_UAPI=ALREADY_COMPATIBLE')
          else:
              old = r'__u32\s+reserved\s*\[\s*1\s*\]\s*;'
              if not re.search(old, body) or re.search(r'\bflags\s*;', body):
                  raise SystemExit('Unknown requestbuffers ABI; refusing header edit')
              body_new, count = re.subn(old, '__u8 flags;\n\t__u8 reserved[3];', body)
              assert count == 1
              dst = Path('/tmp/cuttlefish-videodev2-jammy-compat.h')
              dst.write_text(src[:m.start('body')] + body_new + src[m.end('body'):])
              print('V4L2_UAPI=PATCHED_SAME_ABI')
          PYCODE
          if test -f /tmp/cuttlefish-videodev2-jammy-compat.h; then
            sudo cp -a /usr/include/linux/videodev2.h /tmp/cuttlefish-videodev2.original.h
            sudo install -m 0644 /tmp/cuttlefish-videodev2-jammy-compat.h /usr/include/linux/videodev2.h
          fi
          cat >/tmp/cuttlefish-v4l2-abi.c <<'C'
          #include <stddef.h>
          #include <time.h>
          #include <linux/videodev2.h>
          _Static_assert(sizeof(struct v4l2_requestbuffers) == 20, "V4L2 requestbuffers ABI size changed");
          _Static_assert(offsetof(struct v4l2_requestbuffers, flags) == 16, "V4L2 flags offset wrong");
          _Static_assert(offsetof(struct v4l2_requestbuffers, reserved) == 17, "V4L2 reserved offset wrong");
          int main(void) { return 0; }
          C
          cc -std=c11 -Wall -Wextra -Werror /tmp/cuttlefish-v4l2-abi.c -o /tmp/cuttlefish-v4l2-abi
          /tmp/cuttlefish-v4l2-abi
          echo 'V4L2_ABI_PREFLIGHT=PASS'

      - name: Restore prior Bazel disk cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/cuttlefish-bazel
          key: cf-jammy-${{ inputs.upstream_ref }}-rust189-v4l2abi-${{ github.run_id }}
          restore-keys: |
            cf-jammy-${{ inputs.upstream_ref }}-rust189-v4l2abi-

      - name: Initialize Bazel cache and check registered toolchains
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/cuttlefish-bazel"
          (cd base/cvd && bazel query '@rust_toolchains//:all' >/tmp/cuttlefish-rust-toolchains.txt)
          echo 'Bazel rust toolchains:'
          head -20 /tmp/cuttlefish-rust-toolchains.txt
          grep -q 'rust_toolchain' /tmp/cuttlefish-rust-toolchains.txt || { echo 'Rust toolchains missing'; exit 1; }

      # Compile the EXACT crate that previously failed before embarking on
      # the expensive full Cuttlefish host package build. Do not let a failed
      # media preflight fall through to 22k Bazel actions.
      - name: Preflight compile of virtio-media 0.0.7 with corrected V4L2 UAPI
        shell: bash
        run: |
          set -euo pipefail
          ( cd base/cvd && bazel build \
              --disk_cache="$HOME/.cache/cuttlefish-bazel" \
              --spawn_strategy=local -c opt \
              '@@rules_rust++crate+vhost_user_media_workspace_crates__virtio-media-0.0.7//:virtio_media' )
          echo 'VIRTIO_MEDIA_PREFLIGHT=PASS'

      # Do not stop at the first independent Bazel compilation failure again.
      # --keep_going is diagnostic only; Bazel still exits nonzero if any
      # target fails, so no unverified Debian package can be uploaded.
      - name: Collect all independent Bazel compiler errors in full build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('base/debian/rules')
          src = p.read_text()
          old = 'cd cvd && bazel build ${remote_cache_arg}'
          assert src.count(old) == 1, 'Unexpected upstream Bazel invocation'
          p.write_text(src.replace(old, 'cd cvd && bazel build --keep_going --verbose_failures ${remote_cache_arg}'))
          PYCODE
          git diff -- base/debian/rules

      - name: Build cuttlefish-base on native Jammy
        shell: bash
        run: |
          set -euo pipefail
          tools/buildutils/build_package.sh "$PWD/base" -d "$HOME/.cache/cuttlefish-bazel"

      # This pair runs even when the compilation fails, so later runs can
      # recover whichever outputs made it into the Bazel disk cache. Caching
      # may be skipped if it exceeds this repo's manageable cache budget.
      - name: Check whether Bazel disk cache fits GitHub cache budget
        if: ${{ always() }}
        id: bazel_cache_budget
        shell: bash
        run: |
          set -euo pipefail
          dir="$HOME/.cache/cuttlefish-bazel"
          if [[ ! -d "$dir" ]]; then
            echo 'save=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          size_kib=$(du -sk "$dir" | awk '{print $1}')
          echo "Bazel disk cache: $size_kib KiB"
          if (( size_kib > 6291456 )); then
            echo 'Cache > 6 GiB; skipping GitHub upload (preserves CI time/quota)'
            echo 'save=false' >> "$GITHUB_OUTPUT"
          elif (( size_kib == 0 )); then
            echo 'save=false' >> "$GITHUB_OUTPUT"
          else
            echo 'save=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Save Bazel action cache even after a failed build
        if: ${{ always() && steps.bazel_cache_budget.outputs.save == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/cuttlefish-bazel
          key: cf-jammy-${{ inputs.upstream_ref }}-rust189-v4l2abi-${{ github.run_id }}

      - name: Verify base package against Ubuntu 22.04 apt dependencies
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(cuttlefish-base_*_amd64.deb)
          test "${#files[@]}" -eq 1
          pkg="${files[0]}"
          mkdir -p verified-base
          dpkg-deb -f "$pkg" Package Version Architecture Depends > verified-base/base-metadata.txt
          dpkg-deb -c "$pkg" > verified-base/base-filelist.txt
          grep -Fq '/usr/lib/cuttlefish-common/bin/capability_query.py' verified-base/base-filelist.txt
          apt-get -s install "./$pkg" > verified-base/apt-simulation.txt
          if grep -Eq '^Remv ' verified-base/apt-simulation.txt; then
            echo 'ERROR: APT simulation would remove packages.' >&2
            exit 1
          fi
          cp -- "$pkg" verified-base/
          git rev-parse HEAD > verified-base/upstream-commit.txt
          git diff -- base/cvd/toolchain/rust.MODULE.bazel base/debian/rules > verified-base/jammy-ci-build.patch
          test -s verified-base/jammy-ci-build.patch
          printf '%s\n' \
            'Build: native Ubuntu 22.04 amd64' \
            'Rust: 1.89.0 / edition 2021' \
            'Build-only UAPI adaptation: Linux 5.15 v4l2_requestbuffers reserved[1] -> flags + reserved[3] (ABI size/offset checked)' \
            'Not an upstream/source or installed-host library modification' \
            > verified-base/BUILD_COMPATIBILITY.txt
          ( cd verified-base && sha256sum -- *.deb > SHA256SUMS )
          echo 'PASS: native Jammy build; capability file present; local apt simulation succeeded.'

      - name: Upload verified cuttlefish-base
        uses: actions/upload-artifact@v4
        with:
          name: cuttlefish-base-jammy22-amd64
          path: verified-base/
          if-no-files-found: error
          retention-days: 30

      - name: Install Go for WebRTC frontend build
        if: ${{ inputs.include_web_ui }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'

      - name: Build cuttlefish-user frontend on native Jammy
        if: ${{ inputs.include_web_ui }}
        shell: bash
        run: |
          set -euo pipefail
          tools/buildutils/build_package.sh "$PWD/frontend"

      - name: Verify combined base + user installation plan
        if: ${{ inputs.include_web_ui }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          bases=(cuttlefish-base_*_amd64.deb)
          users=(cuttlefish-user_*_amd64.deb)
          test "${#bases[@]}" -eq 1
          test "${#users[@]}" -eq 1
          mkdir -p verified-web-ui
          dpkg-deb -f "${users[0]}" Package Version Architecture Depends > verified-web-ui/user-metadata.txt
          apt-get -s install "./${bases[0]}" "./${users[0]}" > verified-web-ui/apt-simulation.txt
          if grep -Eq '^Remv ' verified-web-ui/apt-simulation.txt; then
            echo 'ERROR: APT simulation would remove packages.' >&2
            exit 1
          fi
          cp -- "${bases[0]}" "${users[0]}" verified-web-ui/
          git rev-parse HEAD > verified-web-ui/upstream-commit.txt
          ( cd verified-web-ui && sha256sum -- *.deb > SHA256SUMS )
          echo 'PASS: native Jammy build; combined local apt simulation succeeded.'

      - name: Upload verified base + WebRTC user packages
        if: ${{ inputs.include_web_ui }}
        uses: actions/upload-artifact@v4
        with:
          name: cuttlefish-base-user-jammy22-amd64
          path: verified-web-ui/
          if-no-files-found: error
          retention-days: 30
